<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>朗读网页版</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="settings-corner" href="/settings.html">设置</a>
    <main class="shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <h1>朗读</h1>
            <p>选择内容，生成语音。</p>
          </div>
        </header>

        <section class="source-panel">
          <form id="jobForm">
            <input type="hidden" name="mode" id="mode" value="url" />
            <input type="hidden" name="title" id="title" />
            <input type="hidden" name="voice" id="voice" />
            <input type="hidden" name="rate" id="rate" />
            <input type="hidden" name="pause_ms" id="pause_ms" />
            <input type="hidden" name="max_chars" id="max_chars" />

            <div class="field">
              <label for="url">Dropbox 文档链接</label>
              <div class="input-row">
                <input id="url" name="url" type="url" placeholder="https://www.dropbox.com/..." autocomplete="off" />
                <button class="secondary" id="pasteButton" type="button">粘贴</button>
              </div>
            </div>

            <button class="primary" id="submitButton" type="submit" disabled>开始生成</button>
            <button class="secondary cancel-button hidden" id="cancelButton" type="button">取消</button>
          </form>
        </section>

        <p class="message" id="jobMessage"></p>
        <section class="results" id="results"></section>
      </section>
    </main>
    <script src="/config.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
