<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>朗读网页版</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <h1>朗读</h1>
            <p>选择内容，生成语音。</p>
          </div>
          <div class="top-actions">
            <a class="ghost-link" href="/settings.html">设置</a>
            <div class="status-pill" id="serverState">就绪</div>
          </div>
        </header>

        <section class="source-panel">
          <div class="tabs" role="tablist">
            <button class="tab active" data-mode="file" type="button">Word 文件</button>
            <button class="tab" data-mode="url" type="button">Dropbox 链接</button>
            <button class="tab" data-mode="text" type="button">直接输入</button>
          </div>

          <form id="jobForm">
            <input type="hidden" name="mode" id="mode" value="file" />
            <input type="hidden" name="title" id="title" />
            <input type="hidden" name="voice" id="voice" />
            <input type="hidden" name="rate" id="rate" />
            <input type="hidden" name="pause_ms" id="pause_ms" />
            <input type="hidden" name="max_chars" id="max_chars" />

            <div class="field mode-field" data-panel="file">
              <label for="file">选择 Word 文档</label>
              <input id="file" name="file" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
            </div>

            <div class="field mode-field hidden" data-panel="url">
              <label for="url">粘贴 Dropbox 链接</label>
              <input id="url" name="url" type="url" placeholder="https://www.dropbox.com/..." />
            </div>

            <div class="field mode-field hidden" data-panel="text">
              <label for="text">输入文字</label>
              <textarea id="text" name="text" rows="9" placeholder="在这里输入要朗读的文字"></textarea>
            </div>

            <button class="primary" type="submit">开始生成</button>
          </form>
        </section>

        <section class="progress-panel">
          <div class="progress-head">
            <div>
              <h2 id="jobTitle">等待任务</h2>
              <p id="jobMessage">选择内容后开始生成。</p>
            </div>
            <strong id="progressText">0%</strong>
          </div>
          <div class="bar"><span id="progressBar"></span></div>
          <div class="results" id="results"></div>
        </section>
      </section>
    </main>
    <script src="/config.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
