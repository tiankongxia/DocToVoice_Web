<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>朗读网页版</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <h1>朗读</h1>
            <p>选择内容，生成语音。</p>
          </div>
          <a class="settings-corner" href="/settings.html" aria-label="设置" title="设置"></a>
        </header>

        <section class="source-panel">
          <form id="jobForm">
            <input type="hidden" name="mode" id="mode" value="url" />
            <input type="hidden" name="title" id="title" />
            <input type="hidden" name="voice" id="voice" />
            <input type="hidden" name="rate" id="rate" />
            <input type="hidden" name="pause_ms" id="pause_ms" />
            <input type="hidden" name="max_chars" id="max_chars" />

            <div class="field">
              <label for="url">Dropbox 文档链接</label>
              <div class="input-row">
                <input id="url" name="url" type="url" placeholder="https://www.dropbox.com/..." autocomplete="off" />
                <button class="secondary" id="pasteButton" type="button">粘贴</button>
              </div>
            </div>

            <button class="primary" id="submitButton" type="submit" disabled>开始生成</button>
            <button class="secondary cancel-button hidden" id="cancelButton" type="button">取消</button>
          </form>
        </section>

        <p class="message" id="jobMessage"></p>
        <section class="results" id="results"></section>
      </section>
    </main>
    <div class="modal hidden" id="infoModal" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
      <div class="modal-card">
        <div class="modal-head">
          <h2 id="infoTitle">音频信息</h2>
          <button class="icon-button modal-close" id="infoClose" type="button" aria-label="关闭" title="关闭">×</button>
        </div>
        <dl class="info-grid" id="infoGrid"></dl>
      </div>
    </div>
    <div class="modal hidden" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
      <div class="modal-card">
        <div class="modal-head">
          <h2 id="deleteTitle">删除音频</h2>
          <button class="icon-button modal-close" id="deleteClose" type="button" aria-label="关闭" title="关闭">×</button>
        </div>
        <div class="modal-body">
          <p>确定删除这个音频吗？</p>
          <p class="delete-file-name" id="deleteFileName"></p>
        </div>
        <div class="modal-actions">
          <button class="secondary modal-action" id="deleteCancel" type="button">取消</button>
          <button class="danger-action modal-action" id="deleteConfirm" type="button">删除</button>
        </div>
      </div>
    </div>
    <script src="/config.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
